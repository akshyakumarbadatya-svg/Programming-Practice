<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position relative</title>
    <style>
        .parent{
            width:300px;
            height:300px;
            border:3px solid red;
            position :relative
        }
        .child-box{
            width:80px;
            height:80px;
            /* border:4px solid green;/ */
            background-color:greenyellow;
           position:absolute;
            top:30%;
            left:40%;
        }
        .fixed{
            width:100%;
            height: 200px;
            background-color:  yellow;
            position:fixed;
            top:0px;
            z-index: -100;


        }
        .sticky{
            width:150px;
            height: 150pxpx;
            background-color:  rgb(18, 8, 45);
            position:sticky;
            bottom:0px;
            left:30%;
            z-index: -100;


        }
        
    </style>
</head>
<body>
    <h4 class="fixed"></h4>
    <h1>hii </h1>
    <h1>hii good morning everyone</h1>
    <h1>hii good morning everyone</h1>
    <h1>hii good morning everyone</h1>
    <h1>hii good morning everyone</h1>
    <h1 class="sticky">hii good morning everyone</h1>
    <div class="parent">parent
        <div class="child-box">child</div>
    </div>
    <h1>hi</h1>
    <h1></h1>
    <h1></h1>
    <h1></h1>
    <h1></h1>
    <h1></h1>
    <h1></h1>
    <h1></h1>
    <h1></h1>
    <h1>hii</h1>
     
</body>
</html>
