<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Property</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            border: 4px solid rgb(67, 177, 36);
            background-color:linear-gradient(rgb(28, 132, 28),rgb(94, 80, 80),yellow);
            /* transition-property: border-radius; */
            /* transition-property: all; */
            /* transition-duration: 1000ms; */
            /* transition-timing-function: ease-in-out; */
            transition: all 1000ms ease-in-out ;
        }
        .box:hover{
            width:100%;
            background-color: #6049bb;
            border-radius: 40px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
