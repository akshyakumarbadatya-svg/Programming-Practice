<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lineargradient </title>
<style>
    *{
        margin: 0;
    } 
     .Wrap-1{
        width: 100%;
        height: 100vh;
        background: linear-gradient(orange,rgb(227, 227, 225),rgb(0, 128, 58));

    }
    .Wrap-2{
        width: 100%;
        height:100vh;
        background: radial-gradient(circle,green,blue,red);
    } 
      
</style>
</head>
<body>
    <div class="Wrap-1"></div>
    <div class="Wrap-2"></div>
</body>
</html>
