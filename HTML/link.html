<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{
            color: orange;
            text-decoration: none;
        }
        a:active{
            background-color: black;
            color: orangered;
        }
        a:visited{
            color: rgb(44, 163, 163);
        }
        div{
            height: 500px;
            width: 500px;
            border:3px solid red;
            background-color: black;

        }
        div:hover{
            background-color: bisque;
            color: brown;
            border-radius: 245px;

        }
        input:focus{
            width:40%;
            height: 60px;
            border:3px solid red;
            border-radius:40px;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <a href="https://www.wikipedia.org/">wikipedia</a>
    <hr>
    <div></div>
    <input type="text" name="" id="">
</body>
</html>
