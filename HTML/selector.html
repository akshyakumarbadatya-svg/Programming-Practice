<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selectors in html</title>

</head>
<style>
    #head-1 {
    
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
    }
    .channel{
        background-color: peru;
        color: blue;
    }
    /* univeral selector */
    *{
        background-color: aqua;
    }
    h4,h5,h6{
        color: rgb(24, 25, 25);
    }

</style>
<body>
    <h1><span style="color: orange;">Py</span>spidrs</h1>
    <h2 id="head-1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Est sapiente quis sint aperiam voluptates. Suscipit ad nisi eum, id itaque atque at, asperiores commodi distinctio mollitia dicta iste dolor magnam non nobis tempora aliquam.</h2>

    <!-- class selector -->
    <h3 class="channel">Welcome to my Channek</h3>

    <h4 class="a">pyspider</h4>
    <h5 class="a">pyspider</h5>
    <h6 class="a">pyspider</h6>
    <!-- <h4></h4> -->
</body>
</html>
